<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AiroDrop — Offline</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="alternate icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo-192.png">
  <style>
    :root {
      --bg: #07090e;
      --card: rgba(15, 20, 32, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff6a00;
      --accent-pink: #ee0979;
      --accent-glow: rgba(255, 106, 0, 0.3);
      --text: #ffffff;
      --text-muted: #94a3b8;
      --radius: 20px;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 106, 0, 0.12) 0%, transparent 55%),
        radial-gradient(circle at 90% 100%, rgba(238, 9, 121, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 420px;
      width: 100%;
      padding: 36px 24px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon-container {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 106, 0, 0.1);
      border-radius: 50%;
      border: 1.5px dashed var(--accent);
      box-shadow: 0 0 24px var(--accent-glow);
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--accent-glow); }
      50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 106, 0, 0.5); }
    }

    .icon-container svg {
      width: 38px;
      height: 38px;
      color: var(--accent);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 26px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      font-size: 14.5px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-pink));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--accent-glow);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(255, 106, 0, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: none;
      color: #cbd5e1;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      box-shadow: none;
      color: #ffffff;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-3.536 4.978 4.978 0 011.414-3.536m0 0L4.828 4.828M8.464 15.536L3 21M12 12v.01" />
      </svg>
    </div>
    
    <h1>No Internet Connection</h1>
    <p>AiroDrop works over your local Wi-Fi even when offline. Open Local Radar to discover and connect to your PC.</p>
    
    <div class="button-group">
      <a href="/install" class="btn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/>
        </svg>
        <span>Open LAN Radar</span>
      </a>
      <button class="btn btn-secondary" onclick="window.location.reload()">
        <span>Retry Connection</span>
      </button>
    </div>
    
    <div class="footer">
      AiroDrop • Offline LAN File Sharing
    </div>
  </div>
</body>
</html>
